name: Java CI (Build & Test)

on:
  pull_request:
    branches: [ development, qa, main ]

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  build-test:
    runs-on: ubuntu-latest

    env:
      # Sørger for at Spring bruger test-profilen (application-test.properties)
      SPRING_PROFILES_ACTIVE: test
      # Gør Maven-output kortere i CI
      MAVEN_OPTS: -Dstyle.color=always

    steps:
      - name: Checkout
        uses: actions/checkout@d632683dd7b4114ad389b5a9cce7b3b5f3c25d42

      - name: Set up JDK 21
        uses: actions/setup-java@99b867f3f9f6fd2f8c9b0f2a5b2e39e7f89f1bcb
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build & test (Maven verify)
        run: mvn -B -ntp -Dmaven.test.failure.ignore=false verify

      - name: Upload Surefire/Failsafe reports
        if: always()
        uses: actions/upload-artifact@95f4f5b5021c79d38cd6c0c29caea00d3f42330e
        with:
          name: test-reports
          path: |
            **/target/surefire-reports/**
            **/target/failsafe-reports/**
          if-no-files-found: ignore
