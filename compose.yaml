version: "3.9"
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      mysql:
        condition: service_healthy

    ports:
      - "127.0.0.1:8080:8080"
    environment:
      # SPRING_PROFILES_ACTIVE: Hvis man vil have flere miljøer = prod, dev, docker
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${DB_NAME} # Så Spring Boot kan læse DB
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      DB_NAME: ${DB_NAME}
      SPRING_JPA_HIBERNATE_DDL_AUTO: create # ændrer til update, når scriptet reelt må opdateres
  frontend:
    build:
      context: ./FrontendAdventureXP
      dockerfile: Dockerfile
    container_name: adventurexp-frontend
    depends_on:
      - backend
    ports:
      - "127.0.0.1:3000:80"

  mysql:
    image: mysql:latest
    container_name: adventurexp-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASS}
      MYSQL_DATABASE: ${DB_NAME}


    ports:
      - "127.0.0.1:3307:3306"   # containerens port 3306 mappes til vores lokale 3307
    volumes:
      - mysql_data:/var/lib/mysql # Bruger volume'et mysql_data

    healthcheck:
      test: [ "CMD-SHELL", "mysqladmin ping -h localhost -p${DB_PASS} || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql_data: # Opretter docker-volume med navnet mysql_data



