spring.application.name=BackendAdventureXP
spring.datasource.url=jdbc:mysql://mysql:3306/adventurexp
spring.datasource.username=root
spring.datasource.password=${DB_PASS}
spring.jpa.hibernate.ddl-auto=create
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always



server.port=8080

# --- Professional clean logging style ---
spring.output.ansi.enabled=ALWAYS
logging.pattern.console=%clr(%d{yyyy-MM-dd HH:mm:ss}){faint} %clr(%-5p) %clr(%-25.25logger{24}){cyan} : %clr(%m){faint}%n

